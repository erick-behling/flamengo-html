<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cadastro </title>
</head>
<body>
   <h1>Cadastro - Escolinha do Flamengo</h1>

   <p>Preencha o formulário abaixo para realizar sua inscrição na escolinha do Flamengo.</p>

   <form action="#" method="post">

       <h2>Dados do participante</h2>

       <label for="nome">Nome completo:</label>
       <input type="text" id="nome" name="nome" required>
       <br><br>

       <label for="nascimento">Data de nascimento:</label>
       <input type="date" id="nascimento" name="nascimento" required>
       <br><br>

       <label for="email">E-mail:</label>
       <input type="email" id="email" name="email" required>
       <br><br>

       <label for="telefone">Telefone:</label>
       <input type="tel" id="telefone" name="telefone" required>
       <br><br>

       <label for="posicao">Posição desejada:</label>
       <select id="posicao" name="posicao" required>
           <option value="">Selecione</option>
           <option value="goleiro">Goleiro</option>
           <option value="zagueiro">Zagueiro</option>
           <option value="lateral">Lateral</option>
           <option value="meio-campo">Meio-campo</option>
           <option value="atacante">Atacante</option>
       </select>
       <br><br>

       <label for="categoria">Categoria:</label>
       <select id="categoria" name="categoria" required>
           <option value="">Selecione</option>
           <option value="sub-11">Sub-11</option>
           <option value="sub-13">Sub-13</option>
           <option value="sub-15">Sub-15</option>
           <option value="sub-17">Sub-17</option>
       </select>
       <br><br>

       <h2>Termos de inscrição</h2>

       <input type="checkbox" id="termos" name="termos" required>
       <label for="termos">Declaro que as informações fornecidas são verdadeiras e aceito os termos de inscrição.</label>
       <br><br>

       <input type="submit" value="Realizar cadastro">
       <input type="reset" value="Limpar formulário">

   </form>

   <h2>Navegação</h2>

   <a href="index.html">Página inicial</a>
   <br><br>

   <br><br>

   <a href="dados.html">Dados do Flamengo</a>
   <br><br>

   <a href="contato.html">Contato</a>

</body>
</html>
